function attendanceView(){let c=cls(),st=isStaff()?db.students.filter(s=>s.classId===activeClass):children(),day=today(),statusValues=['present','absent','excused','late'];let lessons=db.lessons.filter(l=>l.classId===c).sort((a,b)=>b.date.localeCompare(a.date));return `${head('Třídnice a docházka','Elektronická třídní kniha, zápis hodin a zasedací pořádek.',isStaff()?btn(`${ico('pen-line',16)} Zapsat hodinu`,"openLesson()",true):'')}${isDirector()?`<div class="mb-5">${card(`<div class="flex items-center justify-between gap-3 flex-wrap"><div><b>${ico('school',16)} ${e(db.school||'Škola ještě nebyla vytvořena')}</b><div class="small-note mt-1">Správa profilu školy, oficiálních kanálů a novinek</div></div>${btn('Spravovat školu',"go('school-news')",true)}</div>`)}</div>`:''}<div class="tabbar mb-5">${[['overview','Docházka'],['lessons','Třídní kniha'],['seats','Zasedací pořádek']].map(([k,n])=>`<button class="tab ${tab===k?'active':''}" onclick="tab='${k}';render()">${n}</button>`).join('')}</div>${tab==='overview'?card(`<div class="flex flex-wrap justify-between items-center gap-2 mb-4"><h2 class="section-title">Docházka · ${e(c)} · ${datetime(day)}</h2><span class="tag">${st.length} žáků</span></div><div class="table-wrap"><table><thead><tr><th>Žák</th><th>Stav docházky</th><th>Poznámka</th></tr></thead><tbody>${st.map(s=>{let rec=db.attendance.find(a=>a.studentId===s.id&&a.date===day);return `<tr><td><b>${e(s.name)}</b></td><td>${isStaff()?`<select class="field max-w-[180px] !py-2" onchange="setAttendance('${s.id}',this.value)">${[['present','Přítomen'],['absent','Chybí'],['excused','Omluveno'],['late','Pozdní příchod']].map(([v,n])=>`<option value="${v}" ${rec?.status===v?'selected':''}>${n}</option>`).join('')}</select>`:`<span class="tag ${rec?.status==='absent'?'bad':'success'}">${({present:'Přítomen',absent:'Chybí',excused:'Omluveno',late:'Pozdní příchod'})[rec?.status||'present']}</span>`}</td><td class="muted text-xs">${e(rec?.note||'—')}</td></tr>`}).join('' function setAttendance(id,status,note=''){if(!isStaff())return;let old=db.attendance.find(a=>a.studentId===id&&a.date===today());if(old){old.status=status;if(note)old.note=note}else db.attendance.push({id:uid('att'),studentId:id,date:today(),status,note});save('Docházka byla uložena.')}function shuffleSeats(){if(!isStaff())return;let ids=db.students.filter(s=>s.classId===activeClass).map(s=>s.id);for(let i=ids.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}db.seats[activeClass]=ids;save('Nové rozmístění lavic je uloženo.')}

function qrView(){let s=currentStudent(),passes=db.passes.filter(p=>isStaff()?db.students.some(st=>st.id===p.studentId&&st.classId===activeClass):children().some(st=>st.id===p.studentId));return `${head('QR průkazky a omluvenky','Digitální identita žáka, propustky a evidence odchodu.',user().role==='parent'?btn(`${ico('plus',16)} Vystavit propustku`,`openPass()`,true):'')}<div class="grid-2">${s?card(`<h2 class="section-title mb-4">Digitální průkazka studenta</h2><div class="flex flex-col items-center text-center"><div class="avatar w-16 h-16 text-2xl mb-4">${e(s.name[0])}</div><h3 class="section-title">${e(s.name)}</h3><div class="small-note mt-1">${e(db.school||'Nezaložená škola')} · ${e(s.classId)}</div><div id="student-qr" class="qrcode-wrap mt-5" data-qr="${e(JSON.stringify({type:'STUDENT',id:s.id,school:db.school}))}"></div><p class="small-note mt-4">ID: ${e(s.id)} · VS: ${e(s.vs)}</p></div>`):card(`<h2 class="section-title mb-3">Kontrolní čtečka</h2><p class="small-note">V režimu učitele lze ověřovat vydané propustky.</p><div class="relative rounded-2xl mt-5 h-36 overflow-hidden border" style="background:var(--surface-2);border-color:var(--border)"><div class="laser"></div><div class="h-full flex flex-col gap-2 items-center justify-center muted">${ico('scan-line',32)}<span>Simulované skenování QR</span></div></div>`)}${card(`<h2 class="section-title mb-4">Vydané propustky</h2>${passes.map(p=>`<div class="rowline"><div><b>${e(student(p.studentId)?.name)}</b><div class="small-note">${e(p.reason)}</div><div class="small-note">${e(p.at)}</div></div><div class="flex items-center gap-2 flex-wrap"><span class="tag ${p.used?'success':'warn'}">${p.used?'Odchod zapsán':'Platná'}</span>${btn('QR',`showPass('${p.id}')`,false,'sm')}${isStaff()&&!p.used?btn('Ověřit',`verifyPass('${p.id}')`,true,'sm'):''}</div></div>`).join('')||empty('Žádné propustky.')}${isStaff()?`<p class="small-note mt-4">Kliknutím na Ověřit se kontroluje platnost kódu a zapisuje se odchod do dnešní do function verifyPass(id){if(!isStaff())return;let p=db.passes.find(x=>x.id===id);if(!p||p.used||!db.students.some(s=>s.id===p.studentId&&s.classId===activeClass)){toast('Propustka není platná pro vybranou třídu.');return}p.used=true;p.usedAt=now();let att=db.attendance.find(a=>a.studentId===p.studentId&&a.date===today());if(att){att.status='excused';att.note='Ověřený odchod: '+p.reason}else db.attendance.push({id:uid('att'),studentId:p.studentId,date:today(),status:'excused',note:'Ověřený odchod: '+p.reason});notify(p.authorId,'Propustka pro '+student(p.studentId).name+' byla ověřena.');save('Propustka ověřena, odchod zapsán do třídnice.')}
const MEALS=[['Kuřecí řízek, bramborová kaše','Zeleninové rizoto'],['Hovězí guláš, knedlík','Těstoviny se špenátem'],['Losos, rýže','Zeleninový kuskus'],['Pečené kuře, brambory','Čočkový salát'],['Rajská omáčka, těstoviny','Sýrové noky']];const mealDate=d=>{let current=new Date();let offset=(d+1-current.getDay()+7)%7;let date=new Date(current);date.setDate(current.getDate()+offset);return date.toISOString().slice(0,10)};
function canteenView(){let st=scopeStudents(),s=currentStudent()||st[0];return `${head('Školní jídelna','Týdenní jídelníček, objednávání a kredit na stravování.')}<div class="grid-2 mb-5">${card(`<span class="small-note">Aktuální kredit · ${e(s?.name||'')}</span><div class="text-4xl font-extrabold mt-2">${money(db.mealCredits[s?.id]??0)}</div><p class="small-note mt-3">Cena jednoho oběda: 45 Kč. Storno připsáno okamžitě.</p>`)}${card(`<h2 class="section-title">Alergeny</h2><p class="text-xs muted mt-3 leading-6">1 – obiloviny s lepkem · 3 – vejce · 7 – mléko · 9 – celer · 4 – ryby. Uvedené pokrmy jsou ukázkové.</p>`)}</div><div class="grid-2">${DAYS.map((day,i)=>{let date=mealDate(i),order=db.mealOrders.find(o=>o.studentId===s?.id&&o.date===date);return card(`<div class="flex justify-between items-center mb-4"><h2 class="section-title">${day}</h2><span class="small-note">${datetime(date)}</span></div>${MEALS[i].map((m,j)=>`<div class="rowline"><div><b>Oběd ${j+1}</b><div class="small-note mt-1">${e(m)} · alergeny ${j?'1, 7':'1, 3, 7'}</div></div>${s&&['parent','student'].includes(user().role)?btn(order?.choice===j+1?'Odhlásit':'Objednat',`orderMeal('${s.id}','${date}',${j+1})`,order?.choice===j+1,'sm'):''}</div>`).join('')}${order?'<div class="tag success mt-3">Objednávka potvrzena</div>':''}`)}).join('')}</div>`}
function orderMeal(id,date,choice){if(!children().some(s=>s.id===id))return;let old=db.mealOrders.find(o=>o.studentId===id&&o.date===date),credit=db.mealCredits[id]??0;if(old&&old.choice===choice){db.mealOrders=db.mealOrders.filter(o=>o!==old);db.mealCredits[id]=credit+45;save('Oběd byl odhlášen, kredit vrácen.');return}if(!old&&credit<45){toast('Nedostatek kreditu.');return}if(old)old.choice=choice;else{db.mealOrders.push({id:uid('meal'),studentId:id,date,choice});db.mealCredits[id]=credit-45}save('Oběd byl objednán.')}
function adminView(){if(!isStaff())return empty('Do ředitelny mají přístup pouze zaměstnanci.');return `${head('Ředitelna a správa školy','Účty, třídnictví a školní nastavení.',btn(`${ico('user-plus',16)} Nový žák a rodič`,`openAccount()`,true))}${isDirector()?`<div class="mb-5">${card(`<div class="flex items-center justify-between gap-3 flex-wrap"><div><b>${ico('school',16)} ${e(db.school||'Škola ještě nebyla vytvořena')}</b><div class="small-note mt-1">Správa profilu školy, oficiálních kanálů a novinek</div></div>${btn('Spravovat školu',"go('school-news')",true)}</div>`)}</div>`:''}<div class="tabbar mb-5">${[['overview','Žáci a účty'],['teachers','Učitelé a třídnictví'],['classes','Třídy a předměty']].filter(([k])=>k==='overview'||isDirector()).map(([k,n])=>`<button class="tab ${tab===k?'active':''}" onclick="tab='${k}';render()">${n}</button>`).join('')}</div>${tab==='overview'?card(`<div class="flex justify-between items-center mb-4"><h2 class="section-title">Žáci školy</h2><span class="tag">${db.students.length} žáků</span></div><div class="table-wrap"><table><thead><tr><th>Jméno</th><th>Třída</th><th>Variabilní symbol</th><th>Účet</th></tr></thead><tbody>${db.students.filter(s=>isDirector()||s.classId===activeClass).map(s=>`<tr><td><b>${e(s.name)}</b></td><td>${e(s.classId)}</td><td>${e(s.vs)}</td><td>${db.users.some(u=>u.studentId===s.id)?'<span class="tag success">Aktivní</span>':'<span class="tag">Bez účtu</span>'}</td></tr>`).join('')}</tbody></table></div>`):tab==='teachers'?card(`<div class="flex flex-wrap items-center justify-between gap-2 mb-4"><h2 class="section-title">Učitelský sbor</h2>${btn('Přidat učitele',`openTeacher()`,true,'sm')}</div>${db.users.filter(u=>u.role==='teacher').map(t=>`<div class="rowline"><div class="flex items-center gap-3"><div class="avatar">${e(t.name[0])}</div><div><b>${e(t.name)}</b><div class="small-note">${e(t.username)} · ${t.classId?'Třídní učitel '+e(t.classId):'Bez třídnictví'}</div></div></div><div class="flex gap- function assignTeacher(id,c){if(!isDirector())return;let t=db.users.find(u=>u.id===id);if(t)t.classId=c;save('Třídnictví aktualizováno.')}function addClass(ev){ev.preventDefault();if(!isDirector())return;let name=new FormData(ev.target).get('name').trim();if(db.classes.includes(name)){toast('Třída již existuje.');return}db.classes.push(name);save('Třída přidána.')}function removeClass(c){if(!isDirector())return;if(db.students.some(s=>s.classId===c)){toast('Třídu se žáky nelze odstranit.');return}if(!confirm('Odstranit třídu '+c+'?'))return;db.classes=db.classes.filter(x=>x!==c);db.timetable=db.timetable.filter(x=>x.classId!==c);activeClass=db.classes[0]||'';save('Třída odstraněna.')}function addSubject(ev){ev.preventDefault();if(!isDirector())return;let s=new FormData(ev.target).get('name').trim();if(!db.subjects.includes(s))db.subjects.push(s);save('Předmět přidán.')}function removeSubject(s){if(!isDirector())return;if(db.grades.some(g=>g.subject===s)||db.timetable.some(l=>l.subject===s)){toast('Předmět je používán v rozvrhu nebo klasifikaci.');return}db.subjects=db.subjects.filter(x=>x!==s);save('Předmět odstraněn.')}

</style></head><body><main>`;let body='';if(kind==='fractions'||/zlom/i.test(prompt))body=`<h1>Procvičování zlomků</h1><p>Spočítej součet. Výsledek zadej jako desetinné číslo.</p><h2 id="q"></h2><input id="answer" type="number" step="0.01" placeholder="Výsledek"><button onclick="check()">Zkontrolovat</button><button onclick="next()">Další příklad</button><p id="feedback"></p><script>let a=1,b=2,c=1,d=4;function next(){a=1+Math.floor(Math.random()*4);b=2+Math.floor(Math.random()*5);c=1+Math.floor(Math.random()*4);d=2+Math.floor(Math.random()*5);document.getElementById('q').textContent=a+'/'+b+' + '+c+'/'+d+' = ?';document.getElementById('feedback').textContent='';document.getElementById('answer').value=''}function check(){let v=Number(document.getElementById('answer').value),correct=a/b+c/d;document.getElementById('feedback').textContent=Math.abs(v-correct)<.015?'Správně!':'Zkus to znovu. Správný výsledek je '+correct.toFixed(2)}next()<\/script>`;else if(kind==='quiz'||/kvíz|dějin|histor/i.test(prompt))body=`<h1>Kvíz z českých dějin</h1><h2 id="question"></h2><div id="options"></div><p id="result"></p><script>const data=[['Kdo byl prvním československým prezidentem?',['Tomáš G. Masaryk','Karel IV.','Václav Havel'],0],['V jakém roce vzniklo Československo?',['1918','1938','1945'],0],['Který panovník založil Univerzitu Karlovu?',['Karel IV.','Přemysl Otakar II.','Jan Lucemburský'],0]];let i=0,score=0;function show(){if(i>=data.length){document.getElementById('question').textContent='Hotovo! Skóre '+score+'/'+data.length;document.getElementById('options').innerHTML='';return}document.getElementById('question').textContent=data[i][0];document.getElementById('options').innerHTML=data[i][1].map((o,j)=>'<button onclick="pick('+j+')">'+o+'</button>').join('')}function pick(j){if(j===data[i][2])score++;i++;show()}show()<\/script>`;else if(kind==='website'||/web|pozván/i.test(prompt))body=`<h1>${name}</h1><p>Srdečně vás zveme na školní akci! Vyplňte krátký přihlašovací formulář.</p><form id="f"><p><input name="name" required placeholder="Jméno a příjmení"></p><p><input name="email" type="email" required placeholder="E-mail"></p><button>Přihlásit se</button></form><p id="msg"></p><script>document.getElementById('f').onsubmit=function(ev){ev.preventDefault();const names=JSON.parse(localStorage.getItem('prihlasky-akce')||'[]');names.push(Object.fromEntries(new FormData(this)));localStorage.setItem('prihlasky-akce',JSON.stringify(names));document.getElementById('msg').textContent='Přihláška uložena do prohlížeče.';this.reset()}<\/script>`;else body=`<h1>${name}</h1><p>Interaktivní sada otázek pro procvičování učiva.</p><h2 id="q">Kolik je 7 × 8?</h2><input id="a" type="number" placeholder="Tvoje odpověď"><button onclick="document.getElementById('v').textContent=Number(document.getElementById('a').value)===56?'Výborně!':'Zkus to znovu.'">Ověřit</button><p id="v"></p>`;return head+body+'</main></body></html>'}

let aiPendingFiles=[];

function aiFilesView(){let el=document.getElementById('ai-attachments');if(el)el.innerHTML=aiPendingFiles.map((f,i)=>`<div class="ai-attachment">${f.dataUrl?`<img alt="Náhled přílohy" src="${e(f.dataUrl)}">`:ico('file-text',18)}<span title="${e(f.name)}">${e(f.name)}<small>${Math.round(f.size/1024)} kB</small></span><button type="button" aria-label="Odebrat přílohu" onclick="aiPendingFiles.splice(${i},1);aiFilesView()">${ico('x',14)}</button></div>`).join('');if(window.lucide)lucide.createIcons()}
async function addAiFiles(list){for(let f of [...list]){if(f.size>(f.type.startsWith('image/')?1200*1024:8*1024*1024)){toast('Příloha '+f.name+' je příliš velká (obrázky max. 1,2 MB, soubory max. 8 MB).');continue}if(aiPendingFiles.length>=4){toast('Maximálně 4 přílohy v jedné zprávě.');break}let item={name:f.name,size:f.size,type:f.type,text:'',dataUrl:''};try{if(f.type.startsWith('image/')){item.dataUrl=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}else if(/\.(txt|md|csv|json|html|css|js)$/i.test(f.name)||f.type.startsWith('text/')){item.text=(await f.text()).slice(0,100000)}else if(/\.pdf$/i.test(f.name)){if(window.pdfjsLib){let pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let pages=[];for(let i=1;i<=Math.min(pdf.numPages,20);i++){let pg=await pdf.getPage(i);pages.push((await pg.getTextContent()).items.map(x=>x.str).join(' '))}item.text=pages.join('\n')}else item.error='Čtení PDF není dostupné (knihovna se nenačetla).'}else if(/\.docx$/i.test(f.name)){if(window.mammoth)item.text=(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value.slice(0,100000);else item.error='Čtení DOCX není dostupné (knihovna se nenačetla).'}else item.error='Tento typ souboru lze připojit, ale nelze přečíst jeho obsah.'}catch(err){item.error='Přílohu se nepodařilo načíst.'}aiPendingFiles.push(item)}aiFilesView()}
function aiAnswer(prompt,files){let p=prompt.toLowerCase(),text=files.filter(f=>f.text).map(f=>f.text).join('\n').slice(0,25000),images=files.filter(f=>f.type?.startsWith('image/')),errors=files.filter(f=>f.error).map(f=>`${f.name}: ${f.error}`),prefix=errors.length?'Poznámka: '+errors.join(' ')+'\n\n':'';if(images.length&&!text&&!/počet|žák|tříd|prospěch|znám|úkol|rozvrh|email|e-mail|zlomk/.test(p))return prefix+'Vidím, že byl přiložen obrázek ('+images.map(x=>x.name).join(', ')+'). Dokážu ho zobrazit, ale v této offline verzi nerozpoznávám jeho vizuální obsah. Můžeš obrázek popsat nebo použít AI službu s podporou vidění.';if(text&&/shrň|shrnutí|souhrn|o čem|obsah|analyz|vysvětli|přečti|výpisk/i.test(p)){let cleaned=text.replace(/\s+/g,' ').trim();let sentences=cleaned.match(/[^.!?]+[.!?]?/g)||[];return prefix+'LOKÁLNÍ VÝTAH Z PŘÍLOHY\n\n'+sentences.slice(0,Math.min(6,sentences.length)).map((x,i)=>`${i+1}. ${x.trim()}`).join('\n')+'\n\nJde o automatický výběr úvodních vět, nikoli o inteligentní shrnutí celého dokumentu.'}if(/kolik.*(žák|tříd)|počet.*(žák|tříd)/.test(p))return prefix+`V lokální evidenci školy je ${db.students.length} žáků a ${db.classes.length} tříd.\nTřídy: ${db.classes.join(', ')}.`;if(/prospěch|průměr|známk|klasifikac/.test(p)){let students=scopeStudents(),avgs=students.map(s=>({s,avg:gradeAvg(s.id)})).filter(x=>x.avg!==null);return prefix+`Přehled pro třídu ${cls()}:\nPočet žáků: ${students.length}\nPrůměr z dostupných žákovských průměrů: ${avgs.length?(avgs.reduce((n,x)=>n+x.avg,0)/avgs.length).toFixed(2):'bez známek'}\n\n`+avgs.map(x=>`${x.s.name}: ${x.avg.toFixed(2)}`).join('\n')+'\n\nPrůměr je počítán z uložených známek; nejde o pedagogický posudek.'}if(/úkol/.test(p))return prefix+`Úkoly třídy ${cls()}:\n`+(db.tasks.filter(t=>t.classId===cls()).map(x=>`• ${x.title} (${x.subject})`).join('\n')||'Žádné zadané úkoly.');if(/rozvrh|hodin/.test(p))return prefix+`Rozvrh třídy ${cls()} pro ${DAYS[selectedDay]}:\n`+(db.timetable.filter(x=>x.classId===cls()&&x.day===selectedDay).sort((a,b)=>a.hour-b.hour).map(x=>`${TIMES[x.hour]} – ${x.subject}, učebna ${x.room}`).join('\n')||'Bez výuky.');if(/e-mail|email|rodičům|dopis/.test(p))return prefix+`Předmět: Informace pro rodiče\n\nVážení rodiče,\n\nrádi bychom Vás informovali o ${prompt.replace(/^(napiš|vytvoř|prosím)\s*/i,'').slice(0,120)}. Podrobnosti a případné termíny Vám budou včas sděleny.\n\nDěkujeme za spolupráci.\n\nS pozdravem\n${user().name}\n\nNávrh textu si před odesláním upravte.`;if(/zlomk/.test(p))return prefix+'Zlomek vyjadřuje část celku. Například 1/2 je jedna polovina a 3/4 jsou tři čtvrtiny.\n\nSčítání se stejným jmenovatelem: 1/5 + 2/5 = 3/5.\nPři různých jmenovatelích je nejprve převedeme na společný: 1/2 + 1/4 = 2/4 + 1/4 = 3/4.\n\nZkus si: Kolik je 2/3 + 1/6? (Výsledek: 5/6.)';if(text)return prefix+`Soubor byl přečten (${text.length} znaků). Úvod obsahu:\n\n${text.slice(0,1800)}${text.length>1800?'…':''}\n\nMůžeš napsat „Shrň přiložený soubor“ pro jednoduchý výtah. Pro pokročilé porozumění dokumentu je potřeba připojit skutečný AI model.`;return prefix+'Zadání: „'+prompt+'“\n\nJsem lokální školní asistent. Umím zobrazit a zpracovat textové přílohy, připravit základní školní texty, vysvětlit zlomky a vyhledat údaje o prospěchu, rozvrhu či úkolech. Pro otevřené kreativní úlohy a porozumění fotografiím je třeba bezpečné napojení na skutečný AI model.'}
function sendAiMessage(ev){ev.preventDefault();let box=document.getElementById('ai-prompt'),p=box?.value.trim()||'',files=aiPendingFiles;if(!p&&!files.length){toast('Napiš zadání nebo přilož soubor.');return}let inputFiles=files.map(x=>({name:x.name,type:x.type,size:x.size})),nowText=new Date().toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'}),uidUser=user().id,chat=db.aiChats||(db.aiChats=[]);chat.push({id:uid('ai'),userId:uidUser,role:'user',text:p||'Přiložené soubory',files:inputFiles,at:nowText});let answer=aiAnswer(p,files);chat.push({id:uid('ai'),userId:uidUser,role:'assistant',text:answer,at:nowText,preview:files.find(x=>x.dataUrl)?{kind:'image',data:files.find(x=>x.dataUrl).dataUrl}:null});aiPendingFiles=[];if(chat.length>80)db.aiChats=chat.slice(-80);try{persist()}catch{}render();let thread=document.getElementById('ai-thread');if(thread)thread.scrollTop=thread.scrollHeight}
function advisorResponse(prompt,id){let st=student(id)||scopeStudents()[0],avg=st?gradeAvg(st.id):null,grades=st?db.grades.filter(g=>g.studentId===st.id):[];if(/e-mail|email|rodič/i.test(prompt))return `Předmět: Průběžné informace o školní práci\n\nDobrý den,\n\nrádi bychom Vás informovali o průběžných výsledcích žáka ${st?.name||''}. Aktuální evidovaný vážený průměr je ${avg?.toFixed(2)||'zatím neurčen'}.\n\nProsíme o případnou konzultaci v případě dotazů.\n\nS pozdravem\n${user().name}`;if(/analýz|tříd/i.test(prompt))return `PŘEHLED PROSPĚCHU TŘÍDY ${cls()}\n\nPočet žáků: ${scopeStudents().length}\nPočet evidovaných známek: ${db.grades.filter(g=>scopeStudents().some(s=>s.id===g.studentId)).length}\n\n`+scopeStudents().map(s=>`${s.name}: vážený průměr ${gradeAvg(s.id)?.toFixed(2)||'—'}`).join('\n')+'\n\nDoporučení: Zaměřte se na individuální podporu a průběžnou zpětnou vazbu.';return `SLOVNÍ HODNOCENÍ — ${st?.name||'Žák'}\n\n${st?.name||'Žák'} má aktuálně evidováno ${grades.length} známek s celkovým váženým průměrem ${avg?.toFixed(2)||'—'}. ${avg&&avg<2?'Dosavadní výsledky jsou velmi dobré.':avg&&avg<3?'Dosavadní výsledky jsou uspokojivé a prostor pro další rozvoj je zřejmý.':'Doporučujeme pravidelné procvičování a cílenou podporu v obtížnějších tématech.'}\n\nTento návrh je vytvořen pouze ze známek, bez znalosti širšího kontextu. Učitel by měl hodnocení individuálně upravit.`}
function generateStudio(ev){ev.preventDefault();let f=new FormData(ev.target);studioPrompt=(f.get('prompt')||'').trim();if(studioKind==='poster'){generatedPoster=posterSvg(studioPrompt||'Školní slavnost');studioCode=generatedPoster}else if(studioKind==='advisor'){studioCode=advisorResponse(studioPrompt,f.get('student'))}else{studioCode=htmlApp(studioKind,studioPrompt);studioMode='preview'}render()}function templateStudio(t){studioPrompt=t;if(studioKind==='poster'){generatedPoster=posterSvg(t);studioCode=generatedPoster}else if(studioKind==='advisor')studioCode=advisorResponse(t,scopeStudents()[0]?.id);else{studioCode=htmlApp(studioKind==='app'?(/zlom/i.test(t)?'fractions':'quiz'):'website',t);studioMode='preview'}render()}function copyStudio(){if(!studioCode){toast('Nejprve vytvořte obsah.');return}navigator.clipboard?.writeText(studioCode).then(()=>toast('Výsledek zkopírován.')).catch(()=>fallbackCopy(studioCode))||(!navigator.clipboard&&fallbackCopy(studioCode))}function fallbackCopy(t){let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Výsledek zkopírován.')}function downloadStudio(){if(!studioCode)return;let blob=new Blob([studioCode],{type:studioKind==='poster'?'image/svg+xml':'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=studioKind==='poster'?'plakat.svg':'mini-aplikace.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

function notificationsView(){let notices=db.notifications.filter(n=>n.to===user().id);return `<div class="fixed inset-0 z-50" onclick="notificationOpen=false;render()"><div onclick="event.stopPropagation()" class="absolute top-[69px] right-4 w-[min(410px,calc(100vw-32px))] card p-5" style="max-height:75vh;overflow:auto;box-shadow:0 25px 70px #0003"><div class="flex justify-between items-center mb-3"><h3 class="section-title">Notifikace</h3>${btn('Označit přečtené',`markRead()`,false,'sm')}</div>${notices.map(notifyViewItem).join('')||empty('Nemáte žádné notifikace.')}</div></div>`}function markRead(){db.notifications.filter(n=>n.to===user().id).forEach(n=>n.read=true);notificationOpen=false;save('Notifikace označeny jako přečtené.')}
function aiWidget(){return `<div class="fixed bottom-[87px] right-5 z-50 w-[min(350px,calc(100vw-30px))] card p-5" style="box-shadow:0 25px 70px #0003"><div class="flex justify-between items-center mb-4"><h3 class="section-title flex items-center gap-2">${ico('sparkles',18)} EduAI Asistent</h3><button class="btn sm" onclick="aiOpen=false;render()">${ico('x',14)}</button></div><p class="small-note mb-4">Asistent pracuje s lokálními školními daty. Nevyužívá externí jazykový model.</p><div class="flex flex-col gap-2 mb-3">${['Jaký je průměr třídy?','Kolik mám úkolů?','Co je dnes na rozvrhu?'].map(q=>`<button class="btn sm justify-start" onclick="askAssistant('${q}')">${e(q)}</button>`).join('')}</div><div id="ai-answer" class="rounded-xl p-3 text-xs leading-6" style="background:var(--surface-2)">Zvolte jednu z rychlých otázek.</div><button class="btn primary w-full mt-3" onclick="aiOpen=false;go('ai')">Otevřít celé AI Studio</button></div>`}
function askAssistant(q){let st=scopeStudents(),ans=q.includes('průměr')?`Průměr pro ${cls()}: ${(() => {let a=st.map(s=>gradeAvg(s.id)).filter(x=>x!==null);return a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(2):'bez známek'})()}.`:q.includes('úkolů')?`Pro třídu ${cls()} je evidováno ${db.tasks.filter(t=>t.classId===cls()).length} úkolů a zápisů.`:`Na vybraný den ${DAYS[selectedDay]} je v rozvrhu ${db.timetable.filter(l=>l.classId===cls()&&l.day===selectedDay).length} hodin.`;document.getElementById('ai-answer').textContent=ans}
function themeOptions(){const t=db.theme;return `<h3 class="section-title mt-6 mb-3">Režim zobrazení</h3><div class="grid grid-cols-3 gap-2">${[['light','Světlý','sun'],['dark','Tmavý','moon'],['oled','OLED','circle-dot']].map(([v,n,ic])=>`<button class="btn flex-col ${t.mode===v?'primary':''}" onclick="changeTheme('mode','${v}')">${ico(ic,18)}<span class="text-xs">${n}</span></button>`).join('')}</div><h3 class="section-title mt-7 mb-3">Barevný motiv</h3><div class="flex gap-3 flex-wrap">${[['#5365e8','Královská modrá'],['#0da77b','Smaragdová zelená'],['#8b55d9','Královská fialová'],['#f37c50','Korálová oranžová'],['#db477d','Malinová růžová']].map(([v,n])=>`<button title="${n}" aria-label="${n}" onclick="changeTheme('accent','${v}')" class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:${v};color:white">${t.accent===v?ico('check',20):''}</button>`).join('')}</div><h3 class="section-title mt-7 mb-3">Zaoblení</h3><div class="grid grid-cols-3 gap-2">${[[8,'Ostré'],[16,'Vyvážené'],[28,'Extra']].map(([v,n])=>`<button class="btn ${t.radius===v?'primary':''}" onclick="changeTheme('radius',${v})">${n}</button>`).join('')}</div><h3 class="section-title mt-7 mb-3">Typografie</h3><select class="field" onchange="changeTheme('font',this.value)">${['Plus Jakarta Sans','Inter','Outfit'].map(n=>`<option ${t.font===n?'selected':''}>${n}</option>`).join('')}</select><h3 class="section-title mt-7 mb-3">Hustota a animace</h3><div class="grid grid-cols-2 gap-2">${[['compact','Kompaktní'],['airy','Vzdušný']].map(([v,n])=>`<button class="btn ${t.density===v?'primary':''}" onclick="changeTheme('density','${v}')">${n}</button>`).join('')}</div><label class="rowline mt-2"><span><b>Mikroanimace</b><div class="small-note">Plynulé přechody a efekty</div></span><input type="checkbox" ${t.motion?'checked':''} onchange="changeTheme('motion',this.checked)" class="w-5 h-5 accent-blue-600"></label>`}
// Vlastní školní prostor. Nejde o ověření oprávnění vůči reálné škole.
const safeUrl=u=>{try{let v=new URL(String(u||'').trim());return ['http:','https:'].includes(v.protocol)?v.href:''}catch{return ''}};
function schoolSetupView(){if(!isDirector())return empty('Nastavení školy je přístupné vlastníkovi aplikace.');return `${head(db.schoolProfile?'Upravit školní prostor':'Založ svoji školu','Vyber název libovolné školy v ČR a vytvoř její lokální pracovní prostor.')}<div class="setup-layout"><div class="card p-7"><div class="section-title mb-2">${ico('school',20)} Identita školy</div><p class="small-note mb-6">Název školy zadej přesně. Založení profilu nevytváří oficiální účet skutečné školy ani nepřiděluje oprávnění k jejím datům.</p><form class="stack" onsubmit="saveSchool(event)">${field('name','Oficiální název školy','text',db.schoolProfile?.name||'','minlength="3" maxlength="140" placeholder="Např. Základní škola …"')}${field('city','Město nebo obec','text',db.schoolProfile?.city||'','maxlength="100" placeholder="Praha, Brno, Ostrava …"')}${field('web','Web školy (volitelné)','url',db.schoolProfile?.web||'','data-optional placeholder="https://www.zs-example.cz"')}${field('rss','RSS / Atom kanál aktualit (volitelné)','url',db.schoolProfile?.rss||'','data-optional placeholder="https://www.zs-example.cz/aktuality/feed"')}<div class="grid-2">${field('facebook','Facebook (volitelné)','url',db.schoolProfile?.facebook||'','data-optional placeholder="https://facebook.com/…"')}${field('instagram','Instagram (volitelné)','url',db.schoolProfile?.instagram||'','data-optional placeholder="https://instagram.com/…"')}${field('youtube','YouTube (volitelné)','url',db.schoolProfile?.youtube||'','data-optional placeholder="https://youtube.com/…"')}${field('tiktok','TikTok (volitelné)','url',db.schoolProfile?.tiktok||'','data-optional placeholder="https://tiktok.com/@…"')}</div><button class="btn primary !py-4 w-full">${ico('check-check',17)} ${db.schoolProfile?'Uložit změny školy':'Vytvořit školu'}</button></form></div><div class="setup-aside"><div class="school-orb">${ico('graduation-cap',60)}</div><div class="text-2xl font-extrabold mb-3">Škola. Pod tvou správou.</div><p class="leading-7 text-sm opacity-75">Vlastník aplikace <b>Jakub Mareš</b> může spravovat uživatele, třídy 1.–9. ročníku, rozvrhy, aktuality a propojení veřejných kanálů.</p><div class="mt-8 text-xs opacity-70 leading-6">${ico('info',15)} Veřejná sociální média se zobrazí jako odkazy. Automatický přenos příspěvků vyžaduje povolený RSS/Atom kanál či oficiální API.</div></div></div>`}
function saveSchool(ev){ev.preventDefault();if(!isDirector())return;let f=new FormData(ev.target);let oldFeed=db.schoolProfile?.rss||'';db.schoolProfile={name:String(f.get('name')).trim(),city:String(f.get('city')).trim(),web:safeUrl(f.get('web')),rss:safeUrl(f.get('rss')),facebook:safeUrl(f.get('facebook')),instagram:safeUrl(f.get('instagram')),youtube:safeUrl(f.get('youtube')),tiktok:safeUrl(f.get('tiktok')),createdAt:db.schoolProfile?.createdAt||now(),updatedAt:now(),ownerId:'director'};db.school=db.schoolProfile.name;if(db.schoolProfile.rss!==oldFeed){db.schoolLastSync=null;db.schoolFeedStatus='';}page='school-news';save('Škola byla uložena do místní databáze.');if(db.schoolProfile.rss)refreshSchoolFeed(false)}
function schoolLinks(){let s=db.schoolProfile||{},items=[['web','globe','Web školy'],['facebook','facebook','Facebook'],['instagram','instagram','Instagram'],['youtube','youtube','YouTube'],['tiktok','video','TikTok']].filter(([k])=>s[k]);return items.length?items.map(([k,ic,title])=>`<a class="social-link" target="_blank" rel="noopener noreferrer" href="${e(s[k])}">${ico(ic,17)} ${title} ${ico('arrow-up-right',14)}</a>`).join(''):'<span class="small-note">Přidej web nebo profily školy v nastavení školy.</span>'}
function schoolNewsView(){if(!db.schoolProfile)return schoolSetupView();let s=db.schoolProfile,news=[...db.schoolNews].sort((a,b)=>String(b.published||'').localeCompare(String(a.published||'')));return `${head('Škola a aktuality','Veřejné informační kanály a vlastní školní oznámení.',isDirector()?btn(`${ico('pencil',16)} Upravit školu`,"go('school-setup')",false):'')}<div class="school-banner"><div><div class="login-kicker">TVŮJ ŠKOLNÍ PROSTOR</div><h2 class="text-3xl font-extrabold tracking-tight mt-2">${e(s.name)}</h2><div class="mt-2 opacity-75">${ico('map-pin',16)} ${e(s.city)} · Správce: Jakub Mareš</div></div><div class="school-banner-mark">${ico('school',56)}</div></div><div class="grid-2 mt-5"><div class="card p-6"><div class="flex items-center justify-between gap-3 mb-4"><h3 class="section-title">${ico('radio',19)} Informační kanály</h3><span class="tag">Veřejné odkazy</span></div><div class="flex flex-wrap gap-2">${schoolLinks()}</div><p class="small-note mt-5">Prohlížej aktuální informace na oficiálních stránkách školy a jejích profilech. Platforma nepřistupuje k soukromým účtům.</p></div><div class="card p-6"><div class="flex gap-2 flex-wrap items-center justify-between"><h3 class="section-title">${ico('refresh-cw',19)} Synchronizace novinek</h3>${isDirector()?btn('Načíst RSS',"refreshSchoolFeed(true)",true,'sm'):''}</div><p class="small-note mt-3">${s.rss?'Zdroj: '+e(s.rss):'RSS kanál není nastaven. Přidej jeho URL v nastavení školy.'}</p><div class="mt-3 tag">${e(db.schoolFeedStatus||'Zatím nesynchronizováno')}</div><p class="small-note mt-3">Přenos funguje jen u veřejných RSS/Atom kanálů s povoleným CORS. Instagram, Facebook ani TikTok se bez oficiálního API automaticky nestahují.</p></div></div><div class="flex justify-between flex-wrap gap-3 items-center mt-7 mb-4"><h2 class="section-title">${ico('newspaper',19)} Nástěnka a aktuality</h2>${isDirector()?btn(`${ico('plus',17)} Přidat oznámení`,'openSchoolNews()',true):''}</div>${news.length?`<div class="grid-2">${news.map(n=>card(`<div class="flex items-center justify-between mb-3"><span class="tag ${n.source==='rss'?'':'success'}">${n.source==='rss'?'RSS školy':'Školní oznámení'}</span><span class="small-note">${e(n.published||'')}</span></div><h3 class="font-extrabold text-lg mb-2">${e(n.title)}</h3><p class="muted leading-6">${e(n.description||'')}</p><div class="mt-4 flex justify-between">${n.link?`<a class="btn sm" href="${e(n.link)}" rel="noopener noreferrer" target="_blank">Otevřít zdroj ${ico('external-link',14)}</a>`:'<span></span>'}${isDirector()&&n.source!=='rss'?btn(ico('trash-2',15),`removeSchoolNews('${n.id}')`,false,'sm'):''}</div>`)).join('')}</div>`:card(empty('Zatím žádné novinky. Přidej oznámení nebo propojený RSS kanál.'))}`}
function openSchoolNews(){if(!isDirector())return;openModal('Nové školní oznámení',`<form class="stack" onsubmit="submitSchoolNews(event)">${field('title','Titulek','text','','maxlength="140"')}<div><label class="label">Text oznámení</label><textarea class="field" name="description" maxlength="1500" required></textarea></div><button class="btn primary w-full">Zveřejnit na školní nástěnce</button></form>`)}
function submitSchoolNews(ev){ev.preventDefault();if(!isDirector())return;let f=new FormData(ev.target);db.schoolNews.unshift({id:uid('news'),title:String(f.get('title')).trim(),description:String(f.get('description')).trim(),published:new Date().toISOString(),source:'manual',authorId:user().id});db.users.forEach(u=>{if(u.id!==user().id)notify(u.id,'Nová aktualita školy: '+f.get('title'))});modal='';save('Oznámení bylo zveřejněno.')}
function removeSchoolNews(id){if(!isDirector())return;if(!confirm('Smazat školní oznámení?'))return;db.schoolNews=db.schoolNews.filter(x=>x.id!==id||x.source==='rss');save('Oznámení bylo odstraněno.')}
let schoolFeedBusy=false;
async function refreshSchoolFeed(manual=true){let url=safeUrl(db.schoolProfile?.rss);if(!url){if(manual)toast('Nejdříve nastav RSS/Atom adresu školy.');return}if(schoolFeedBusy)return;schoolFeedBusy=true;db.schoolFeedStatus='Načítám veřejný RSS kanál…';persist();if(page==='school-news')render();try{let response=await fetch(url,{mode:'cors',signal:AbortSignal.timeout(11000),headers:{Accept:'application/rss+xml, application/atom+xml, application/xml, text/xml'}});if(!response.ok)throw Error('HTTP '+response.status);let xml=new DOMParser().parseFromString(await response.text(),'application/xml');if(xml.querySelector('parsererror'))throw Error('Neplatný XML dokument');let items=[...xml.querySelectorAll('item,entry')].slice(0,25);if(!items.length)throw Error('Kanál neobsahuje položky');let count=0;for(let item of items){let get=(tag)=>item.querySelector(tag)?.textContent?.trim()||'';let title=get('title'),link=get('link')||item.querySelector('link')?.getAttribute('href')||'',summary=get('description')||get('summary')||get('content'),published=get('pubDate')||get('published')||get('updated')||new Date().toISOString();let date=new Date(published);let normalized=Number.isNaN(date.getTime())?new Date().toISOString():date.toISOString();let id='rss_'+Array.from(new TextEncoder().encode(link+'|'+title)).reduce((a,b)=>(a*31+b)>>>0,7).toString(36);if(!title||db.schoolNews.some(n=>n.id===id))continue;db.schoolNews.push({id,title:title.slice(0,180),description:summary.replace(/<[^>]*>/g,'').slice(0,550),link:safeUrl(link),published:normalized,source:'rss'});count++}db.schoolNews=db.schoolNews.filter(n=>n.source!=='rss').concat(db.schoolNews.filter(n=>n.source==='rss').sort((a,b)=>b.published.localeCompare(a.published)).slice(0,70));db.schoolLastSync=new Date().toISOString();db.schoolFeedStatus=`Aktualizováno ${now()} · ${count} nových zpráv`;if(manual)toast(`RSS načteno: ${count} nových příspěvků.`)}catch(err){db.schoolFeedStatus='RSS nelze načíst přímo: '+String(err.message||'chyba').slice(0,90);if(manual)toast('Web školy neumožňuje přímé načtení RSS nebo není dostupný.')}finally{schoolFeedBusy=false;persist();if(page==='school-news')render()}}
let feedTimer=setInterval(()=>{if(db.schoolProfile?.rss&&user()&&(!db.schoolLastSync||Date.now()-new Date(db.schoolLastSync).getTime()>15*60*1000))refreshSchoolFeed(false)},15*60*1000);
function drawerView(){return `<div class="fixed inset-0 z-[80]" style="background:#060b1b77;backdrop-filter:blur(4px)" onclick="drawer='';render()"></div><aside class="drawer"><div class="flex items-center justify-between"><div><h2 class="page-title">Theme Studio</h2><p class="small-note">Osobní vzhled a systémové nastavení</p></div><button class="btn sm" onclick="drawer='';render()">${ico('x',17)}</button></div>${themeOptions()}<div class="mt-8 pt-6" style="border-top:1px solid var(--border)"><h3 class="section-title mb-3">Databáze školy</h3><p class="small-note mb-4">Změny se ukládají pouze na tomto zařízení. Obnovení smaže veškeré lokální záznamy.</p><button class="btn danger w-full" onclick="resetDatabase()">${ico('rotate-ccw',16)} Obnovit tovární data školy</button></div></aside>`}function changeTheme(k,v){db.theme[k]=v;persist();initTheme();render()}function resetDatabase(){if(!confirm('Opravdu obnovit tovární data? Všechny lokální změny budou nevratně smazány.'))return;db=seed();page='dashboard';drawer='';modal='';aiOpen=false;notificationOpen=false;persist();render();toast('Tovární data školy byla obnovena.')}
function openModal(title,content){modal={title,content};render()}function closeModal(){modal='';render()}function modalView(){if(!modal)return '';return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="flex justify-between items-center mb-6"><h2 class="section-title">${e(modal.title)}</h2><button class="btn sm" aria-label="Zavřít" onclick="closeModal()">${ico('x',17)}</button></div>${modal.content}</div></div>`}
function openGrade(){if(!isStaff())return;let students=db.students.filter(s=>s.classId===activeClass);openModal('Zapsat novou známku',`<form class="stack" onsubmit="submitGrade(event)">${select('student','Žák',students.map(s=>[s.id,s.name]))}${select('subject','Předmět',db.subjects)}<div class="form-grid">${select('grade','Známka',[1,2,3,4,5])}${select('weight','Váha',Array.from({length:10},(_,i)=>i+1),5)}</div><div><label class="label">Slovní poznámka</label><textarea class="field" name="note" placeholder="Např. Písemná práce z matematiky"></textarea></div><button class="btn primary w-full">${ico('save',16)} Uložit známku</button></form>`)}function submitGrade(ev){ev.preventDefault();if(!isStaff())return;let f=Object.fromEntries(new FormData(ev.target)),s=student(f.student);if(!s||s.classId!==activeClass)return;db.grades.push({id:uid('g'),studentId:s.id,subject:f.subject,grade:Number(f.grade),weight:Number(f.weight),note:f.note.trim(),date:today(),authorId:user().id});db.users.filter(u=>u.role==='parent'&&u.children?.includes(s.id)||u.role==='student'&&u.studentId===s.id).forEach(u=>notify(u.id,`Nová známka ${f.grade} (${f.subject}) pro ${s.name}.`));modal='';save('Nová známka byla uložena a oznámena.')}
function openLesson(){if(!isStaff())return;openModal('Zapsat a podepsat vyučovací hodinu',`<form class="stack" onsubmit="submitLesson(event)">${field('date','Datum','date',today())}${select('subject','Předmět',db.subjects)}<div><label class="label">Téma hodiny</label><textarea class="field" required name="topic" placeholder="Co jste dnes probírali?"></textarea></div><p class="small-note">Zápis bude elektronicky podepsán vaším přihlášeným účtem.</p><button class="btn primary w-full">${ico('signature',16)} Podepsat a uložit hodinu</button></form>`)}function submitLesson(ev){ev.preventDefault();if(!isStaff())return;let f=Object.fromEntries(new FormData(ev.target));db.lessons.push({id:uid('log'),classId:activeClass,date:f.date,subject:f.subject,topic:f.topic.trim(),teacherId:user().id,at:now()});modal='';save('Hodina byla podepsána a zapsána.')}
function openSub(id){if(!isStaff())return;let l=db.timetable.find(x=>x.id===id);if(!l)return;let current=db.substitutions.find(s=>s.lessonId===id);openModal('Změna rozvrhu · '+l.subject,`<form class="stack" onsubmit="submitSub(event,'${id}')"><div class="tag">${e(l.classId)} · ${e(DAYS[l.day])} · ${l.hour+1}. hodina</div>${select('teacher','Suplující učitel',[['','Původní vyučující'],...db.users.filter(u=>u.role==='teacher'||u.role==='director').map(u=>[u.id,u.name])],current?.teacherId||'')}${field('room','Učebna','text',current?.room||l.room,'maxlength="25"')}<label class="flex items-center gap-2 font-semibold"><input type="checkbox" name="canceled" ${current?.canceled?'checked':''}> Hodina odpadá</label><button class="btn primary w-full">Uložit změnu rozvrhu</button>${current?btn('Zrušit suplování',`clearSub('${id}')`,false,'danger'):''}</form>`)}function submitSub(ev,id){ev.preventDefault();if(!isStaff())return;let f=new FormData(ev.target),l=db.timetable.find(x=>x.id===id);if(!l)return;db.substitutions=db.substitutions.filter(s=>s.lessonId!==id);db.substitutions.push({id:uid('sub'),lessonId:id,teacherId:f.get('teacher'),room:f.get('room').trim(),canceled:f.has('canceled'),authorId:user().id});db.users.filter(u=>(u.role==='parent'&&u.children?.some(sid=>student(sid)?.classId===l.classId))||(u.role==='student'&&student(u.studentId)?.classId===l.classId)).forEach(u=>notify(u.id,`Změna rozvrhu: ${l.classId}, ${DAYS[l.day]}, ${l.hour+1}. hodina.`));modal='';save('Suplování bylo zveřejněno.')}
function clearSub(id){if(!isStaff())return;db.substitutions=db.substitutions.filter(s=>s.lessonId!==id);modal='';save('Suplování bylo zrušeno.')}
function openTask(){if(!isStaff())return;openModal('Nový domácí úkol / zápis',`<form class="stack" onsubmit="submitTask(event)">${select('type','Typ', [['task','Domácí úkol'],['note','Zápis z hodiny']])}${select('subject','Předmět',db.subjects)}${field('title','Název','text','','maxlength="130"')}${field('due','Termín','date',today())}<div><label class="label">Zadání / obsah</label><textarea class="field" name="body" required></textarea></div><button class="btn primary w-full">${ico('save',16)} Publikovat</button></form>`)}function submitTask(ev){ev.preventDefault();if(!isStaff())return;let f=Object.fromEntries(new FormData(ev.target));db.tasks.push({id:uid('task'),classId:activeClass,subject:f.subject,title:f.title.trim(),type:f.type,due:f.due,body:f.body.trim(),authorId:user().id});db.users.filter(u=>u.role==='student'&&student(u.studentId)?.classId===activeClass||u.role==='parent'&&u.children?.some(id=>student(id)?.classId===activeClass)).forEach(u=>notify(u.id,`Nový školní materiál pro ${activeClass}: ${f.title}`));modal='';save('Materiál publikován.')}
function openMessage(){let others=db.users.filter(u=>u.id!==user().id);openModal('Napsat novou zprávu',`<form class="stack" onsubmit="submitMessage(event)">${select('to','Příjemce',others.map(u=>[u.id,`${u.name} (${roleName(u.role)})`]))}${field('title','Předmět zprávy','text','','maxlength="150"')}<div><label class="label">Text zprávy</label><textarea class="field" name="body" required></textarea></div><button class="btn primary w-full">${ico('send',16)} Odeslat zprávu</button></form>`)}function submitMessage(ev){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target));if(!db.users.some(u=>u.id===f.to))return;db.messages.push({id:uid('msg'),from:user().id,to:f.to,title:f.title.trim(),body:f.body.trim(),at:now(),readBy:[]});notify(f.to,'Nová zpráva od '+user().name+': '+f.title);modal='';save('Zpráva byla odeslána.')}
function readMessage(id){let m=db.messages.find(x=>x.id===id);if(!m||![m.from,m.to].includes(user().id))return;if(!m.readBy.includes(user().id))m.readBy.push(user().id);persist();openModal(m.title,`<div class="small-note mb-4">Od: ${e(fullName(m.from))} · Komu: ${e(fullName(m.to))} · ${e(m.at)}</div><p class="text-sm leading-7 whitespace-pre-wrap">${e(m.body)}</p><div class="flex justify-end mt-6">${btn('Odpovědět',`replyMessage('${m.from}')`,true)}</div>`)}function replyMessage(id){openMessage();let el=document.querySelector('.modal select[name=to]');if(el)el.value=id}
function openPass(){if(user().role!=='parent')return;openModal('Nová QR propustka',`<form class="stack" onsubmit="submitPass(event)">${select('student','Dítě',children().map(s=>[s.id,s.name]),activeChild)}${field('reason','Důvod a čas odchodu','text','','placeholder="Např. Návštěva lékaře v 11:30" maxlength="180"')}<button class="btn primary w-full">${ico('qr-code',17)} Vygenerovat propustku</button></form>`)}function submitPass(ev){ev.preventDefault();if(user().role!=='parent')return;let f=Object.fromEntries(new FormData(ev.target));if(!user().children.includes(f.student))return;let p={id:uid('pass'),token:uid('verify')+uid('sec'),studentId:f.student,reason:f.reason.trim(),at:now(),authorId:user().id,used:false};db.passes.unshift(p);db.users.filter(u=>['teacher','director'].includes(u.role)).forEach(u=>notify(u.id,`Nová QR propustka pro ${student(p.studentId).name}.`));modal='';save('Propustka byla vytvořena.');showPass(p.id)}
function showPass(id){let p=db.passes.find(x=>x.id===id);if(!p)return;openModal('Ověřovací QR propustka',`<div class="text-center"><h3 class="section-title">${e(student(p.studentId)?.name)}</h3><p class="small-note my-3">${e(p.reason)} · ${e(p.at)}</p><div class="qrcode-wrap my-4" data-qr="${e(JSON.stringify({type:'EXIT_PASS',id:p.id,token:p.token,studentId:p.studentId}))}"></div><p class="small-note">ID propustky: ${e(p.id)}</p><div class="tag ${p.used?'success':'warn'} mt-3">${p.used?'Již ověřena':'Čeká na ověření'}</div></div>`)}
function showPayment(id){let p=db.payments.find(x=>x.id===id);if(!p||!scopeStudents().some(s=>s.id===p.studentId))return;let st=student(p.studentId),qr=`SPD*1.0*ACC:CZ6508000000192000145399*AM:${Number(p.amount).toFixed(2)}*CC:CZK*X-VS:${st.vs}*MSG:${p.title.slice(0,30)}`;openModal('QR platba · '+p.title,`<div class="text-center"><div class="text-3xl font-extrabold">${money(p.amount)}</div><p class="small-note mt-2">VS: ${e(st.vs)} · ${e(st.name)}</p><div class="qrcode-wrap my-6" data-qr="${e(qr)}"></div><p class="small-note">Ukázkové číslo účtu — před reálnou platbou nahraďte účtem školy. Tlačítko níže provádí pouze ruční označení úhrady v lokální evidenci.</p><div class="mt-6">${btn(`${ico('check',16)} Označit jako uhrazené`,`markPaid('${id}')`,true)}</div></div>`)}function markPaid(id){if(user().role!=='parent'&&!isStaff())return;let p=db.payments.find(x=>x.id===id);if(!p)return;if(!isStaff()&&!user().children.includes(p.studentId))return;p.paid=true;p.paidAt=now();notifyRole('director',`Platba pro ${student(p.studentId).name} označena jako uhrazená.`);modal='';save('Platba označena jako uhrazená (lokálně).')}
function openAccount(){if(!isStaff())return;openModal('Založit účty žáka a rodiče',`<form class="stack" onsubmit="submitAccount(event)">${field('studentName','Jméno žáka','text','','maxlength="90"')}${select('classId','Třída',db.classes,activeClass)}${field('parentName','Jméno rodiče','text','','maxlength="90"')}${field('email','E-mail rodiče','email','','maxlength="150"')}<button class="btn primary w-full">${ico('user-plus',16)} Vytvořit oba účty</button></form>`)}function submitAccount(ev){ev.preventDefault();if(!isStaff())return;let f=Object.fromEntries(new FormData(ev.target)),sid=uid('s'),pidx=db.users.length+1,suser='zak'+pidx,puser='rodic'+pidx,password='Skola'+Math.floor(1000+Math.random()*9000),vs=String(Date.now()).slice(-7);let st={id:sid,name:f.studentName.trim(),classId:f.classId,vs};db.students.push(st);db.users.push({id:uid('u'),name:st.name,role:'student',username:suser,password,studentId:sid});db.users.push({id:uid('u'),name:f.parentName.trim(),role:'parent',username:puser,password,children:[sid],email:f.email});db.mealCredits[sid]=0;persist();openModal('Přístupové kartičky byly vytvořeny',`<div class="rounded-xl p-4" style="background:var(--surface-2)"><h3 class="section-title mb-3">Žák · ${e(st.name)}</h3><p>Přihlašovací jméno: <b>${e(suser)}</b></p><p>Heslo: <b>${e(password)}</b></p><div class="qrcode-wrap my-3" data-qr="${e(JSON.stringify({username:suser,password}))}"></div></div><div class="rounded-xl p-4 mt-3" style="background:var(--surface-2)"><h3 class="section-title mb-3">Rodič · ${e(f.parentName)}</h3><p>Přihlašovací jméno: <b>${e(puser)}</b></p><p>Heslo: <b>${e(password)}</b></p><div class="qrcode-wrap my-3" data-qr="${e(JSON.stringify({username:puser,password}))}"></div></div><p class="small-note mt-4">Údaje jsou pouze pro lokální demo. QR přístupová kartička obsahuje heslo — v produkční aplikaci používejte bezpečné jednorázové pozvánky.</p><div class="mt-3">${btn('Vytisknout kartičky',`window.print()`,true)}</div>`);toast('Žák a rodič byli přidáni do evidence.')}
function openTeacher(){if(!isDirector())return;openModal('Přidat učitele',`<form class="stack" onsubmit="submitTeacher(event)">${field('name','Jméno učitele','text','','maxlength="90"')}${field('username','Přihlašovací jméno','text','','maxlength="40"')}${field('password','Heslo','text','','minlength="6"')}${select('classId','Třídnictví',[['','Bez třídnictví'],...db.classes.map(c=>[c,c])])}<button class="btn primary">Vytvořit účet učitele</button></form>`)}function submitTeacher(ev){ev.preventDefault();if(!isDirector())return;let f=Object.fromEntries(new FormData(ev.target));if(db.users.some(u=>u.username===f.username)){toast('Přihlašovací jméno je obsazené.');return}db.users.push({id:uid('u'),name:f.name.trim(),username:f.username.trim(),password:f.password,role:'teacher',classId:f.classId});modal='';save('Učitel byl přidán.')}
function runQr(){if(typeof QRCode==='undefined')return;document.querySelectorAll('[data-qr]').forEach(node=>{let val=node.getAttribute('data-qr');if(!val)return;node.innerHTML='';try{new QRCode(node,{text:val,width:154,height:154,colorDark:'#111827',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch{node.textContent='QR není dostupný.'}})}
function render(){if(user()?.owner&&!db.schoolProfile&&page!=='school-setup')page='school-setup';initTheme();document.getElementById('app').innerHTML=user()?shell():loginView();if(window.lucide)lucide.createIcons();if(user()&&page==='ai'){aiFilesView();let thread=document.getElementById('ai-thread');if(thread)thread.scrollTop=thread.scrollHeight}runQr()}
window.addEventListener('storage',ev=>{if(ev.key===KEY){try{db=JSON.parse(ev.newValue)||seed();render()}catch{}}});window.addEventListener('keydown',ev=>{if(ev.key==='Escape'){modal='';drawer='';notificationOpen=false;aiOpen=false;render()}});persist();render();
</script>
</body>
</html>
